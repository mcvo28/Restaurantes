<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eat & Drink</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#111;--surface:#1C1C1E;--surface2:#2C2C2E;--border:#3A3A3C;
  --text:#F2F2F7;--text2:#8E8E93;--text3:#48484A;
  --accent:#E8622A;--green:#34C759;--red:#FF3B30;--gold:#F0A500;
  --wine:#8B1A4A;--whisky:#C27C0E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding-bottom:48px}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:10px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.4px}
.topbar-right{display:flex;gap:8px}
.tbtn{background:var(--surface2);border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.tbtn-accent{background:var(--accent);color:#fff}

/* APP TABS */
.app-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px}
.app-tab{flex:1;padding:12px 0;text-align:center;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.app-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* SEARCH */
.search-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px}
.search-wrap{position:relative}
.search-wrap input{width:100%;background:var(--surface2);border:none;border-radius:10px;padding:10px 14px 10px 36px;font-size:15px;color:var(--text);font-family:'Inter',sans-serif;outline:none}
.search-wrap input::placeholder{color:var(--text3)}
.s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:17px;pointer-events:none}

/* FILTER BAR */
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px}
.filter-wrap{display:flex;flex-wrap:wrap;gap:7px}
.f-btn{display:flex;align-items:center;gap:5px;background:var(--surface2);border:none;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.f-btn.on{background:rgba(232,98,42,.15);color:var(--accent)}
.f-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.f-clear{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;padding:8px 4px}

/* HOME GRID */
.home-view{padding:16px}
.home-header{margin-bottom:14px}
.home-title{font-size:20px;font-weight:700;letter-spacing:-.4px}
.home-sub{font-size:13px;color:var(--text2);margin-top:2px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-card{border-radius:16px;padding:18px 16px;cursor:pointer;position:relative;overflow:hidden;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.06);transition:transform .15s,opacity .15s}
.cat-card:active{transform:scale(.97);opacity:.85}
.cat-card-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px;line-height:1.2}
.cat-card-count{font-size:12px;color:rgba(255,255,255,.65);font-weight:500}
.cat-card-icon{font-size:28px;position:absolute;right:14px;top:14px;opacity:.35}
.cat-card-full{grid-column:1/-1;min-height:70px;flex-direction:row;align-items:center;gap:12px}
.cat-card-full .cat-card-icon{position:static;opacity:.5;font-size:24px}

/* LIST */
.list-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.list-count{font-size:13px;color:var(--text2)}
.list-count strong{color:var(--text);font-weight:600}
.list-back{background:none;border:none;font-size:13px;color:var(--accent);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;padding:0}
.sort-btn{background:none;border:none;font-size:13px;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.list-header-left{display:flex;align-items:center;gap:10px}
.cards{padding:0 16px}

/* CARDS */
.card{background:var(--surface);border-radius:14px;margin-bottom:10px;overflow:hidden;cursor:pointer;display:flex;border:1px solid var(--border)}
.card:active{opacity:.7}
.card.priority{border-color:var(--accent);border-width:2px}
.card-stripe{width:4px;flex-shrink:0}
.card-body{flex:1;padding:13px 14px;min-width:0}
.card-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px}
.card-name{font-size:16px;font-weight:600;letter-spacing:-.3px;line-height:1.25;display:flex;align-items:center;gap:6px}
.priority-icon{color:var(--accent);font-size:13px}
.card-score{font-size:13px;font-weight:700;color:var(--gold)}
.card-status-pills{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.spill{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:500}
.spill-foi{background:rgba(52,199,89,.15);color:#34C759}
.spill-quer{background:rgba(232,98,42,.12);color:var(--accent)}
.spill-volta{background:rgba(240,165,0,.15);color:var(--gold)}
.spill-nao{background:rgba(255,59,48,.12);color:var(--red)}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.ctag{font-size:12px;padding:3px 9px;border-radius:8px;background:var(--surface2);color:var(--text2)}
.ctag-dest{background:rgba(142,68,173,.15);color:#C39BD3}
.card-obs{font-size:12px;color:var(--text3);font-style:italic;margin-top:4px}
.empty{padding:60px 20px;text-align:center;color:var(--text3);font-size:15px}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;backdrop-filter:blur(4px)}
.overlay.show{display:block}
.drawer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:101;max-height:85vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
.drawer.show{transform:translateY(0)}
.drawer-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px;flex-shrink:0}
.drawer-title{font-size:17px;font-weight:700;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-body{overflow-y:auto;padding:20px;flex:1;-webkit-overflow-scrolling:touch}
.drawer-body::-webkit-scrollbar{display:none}
.d-chips{display:flex;flex-wrap:wrap;gap:10px}
.dchip{font-size:14px;font-weight:500;padding:10px 18px;border-radius:22px;border:1.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.dchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.drawer-footer{display:flex;gap:10px;padding:14px 20px 36px;border-top:1px solid var(--border);flex-shrink:0}
.d-act{flex:1;padding:13px;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none;background:var(--surface2);color:var(--text2)}
.d-act-primary{background:var(--accent);color:#fff}

.menu-drawer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:101;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
.menu-drawer.show{transform:translateY(0)}
.menu-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px}
.menu-item{display:flex;align-items:center;gap:14px;padding:16px 24px;border:none;background:none;font-family:'Inter',sans-serif;font-size:16px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;width:100%;border-top:1px solid var(--border)}
.menu-item:first-of-type{border-top:none}
.menu-spacer{height:36px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;backdrop-filter:blur(4px)}
.modal-overlay.show{display:block}
.modal{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:201;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
.modal.show{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px;flex-shrink:0}
.modal-title{font-size:17px;font-weight:700;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-body{overflow-y:auto;padding:16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.modal-body::-webkit-scrollbar{display:none}
.mfield{margin-bottom:16px}
.mfield label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:8px}
.mfield label span{text-transform:none;font-weight:400;color:var(--text3)}
.mfield input,.mfield select,.mfield textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);padding:11px 14px;font-size:15px;font-family:'Inter',sans-serif;outline:none}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{border-color:var(--accent)}
.mfield textarea{resize:none;height:72px;line-height:1.5}
.mfield select option{background:var(--surface2)}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{font-size:14px;font-weight:500;padding:9px 16px;border-radius:22px;border:1.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.mchip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.mchip.sel-m{border-color:var(--accent);color:var(--accent);background:rgba(232,98,42,.12)}
.mchip-del{font-size:12px;padding:7px 10px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:5px}
.add-custom-row{display:flex;gap:8px;margin-top:10px}
.add-custom-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif;outline:none}
.add-custom-input:focus{border-color:var(--accent)}
.add-custom-btn{background:var(--accent);border:none;border-radius:12px;color:#fff;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.score-wrap{display:flex;align-items:center;gap:12px}
.score-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--surface2);outline:none}
.score-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);cursor:pointer}
.score-val{font-size:20px;font-weight:700;color:var(--gold);min-width:36px;text-align:center}
.priority-toggle{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:12px;padding:12px 16px;cursor:pointer;border:1.5px solid var(--border)}
.priority-toggle.on{border-color:var(--accent);background:rgba(232,98,42,.1)}
.priority-toggle-label{font-size:15px;font-weight:500;color:var(--text2);flex:1}
.priority-toggle.on .priority-toggle-label{color:var(--text)}
.priority-toggle-icon{font-size:20px}
.modal-footer{flex-shrink:0;padding:12px 20px 36px;border-top:1px solid var(--border);display:flex;gap:10px}
.m-act{flex:1;padding:14px;border-radius:13px;font-size:16px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none;background:var(--surface2);color:var(--text2)}
.m-act-primary{background:var(--accent);color:#fff}
.m-act-danger{background:rgba(255,59,48,.1);color:var(--red)}
.cidade-sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.csug{font-size:13px;padding:5px 12px;border-radius:12px;background:var(--surface2);color:var(--text2);cursor:pointer;border:none;font-family:'Inter',sans-serif}
.hidden{display:none!important}
.section-divider{height:1px;background:var(--border);margin:4px 0 16px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo" id="topbar-logo">🍽 Eat & Drink</div>
  <div class="topbar-right">
    <button class="tbtn tbtn-accent" id="btn-novo" onclick="openAdd()">+ Novo</button>
    <button class="tbtn" onclick="openMenu()">⋯</button>
  </div>
</div>

<div class="app-tabs">
  <div class="app-tab active" onclick="switchApp('rest')" id="tab-rest">🍽 Restaurantes</div>
  <div class="app-tab" onclick="switchApp('wine')" id="tab-wine">🍷 Vinhos</div>
  <div class="app-tab" onclick="switchApp('whis')" id="tab-whis">🥃 Whisky</div>
</div>

<div class="search-bar">
  <div class="search-wrap">
    <span class="s-icon">⌕</span>
    <input type="text" id="search" placeholder="Buscar..." autocomplete="off">
  </div>
</div>

<div id="home-view">
  <div class="home-view">
    <div class="home-header">
      <div class="home-title" id="home-title"></div>
      <div class="home-sub" id="home-sub"></div>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>
</div>

<div id="list-view" class="hidden">
  <div class="filter-bar"><div class="filter-wrap" id="filters-wrap"></div></div>
  <div class="list-header">
    <div class="list-header-left">
      <button class="list-back" onclick="goHome()">← Voltar</button>
      <div class="list-count" id="list-count"></div>
    </div>
    <button class="sort-btn" onclick="cycleSort()">↕ <span id="sort-lbl">Prioridade</span></button>
  </div>
  <div class="cards" id="cards"></div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title" id="drawer-title"></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer">
    <button class="d-act" onclick="clearGroupFilter()">Limpar</button>
    <button class="d-act d-act-primary" onclick="closeDrawer()">Ver resultados</button>
  </div>
</div>

<div class="overlay" id="menu-overlay" onclick="closeMenu()"></div>
<div class="menu-drawer" id="menu-drawer">
  <div class="menu-handle"></div>
  <button class="menu-item" onclick="exportJSON();closeMenu()">↓ Exportar backup (.json)</button>
  <label class="menu-item" style="cursor:pointer">↑ Importar backup (.json)
    <input type="file" accept=".json" style="display:none" onchange="importJSON(event);closeMenu()">
  </label>
  <button class="menu-item" id="menu-manage-cats" onclick="openManageCategories();closeMenu()">✎ Gerenciar categorias</button>
  <button class="menu-item" id="menu-manage-vibes" onclick="openManageVibes();closeMenu()" style="display:none">✎ Gerenciar vibes</button>
  <div class="menu-spacer"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-handle"></div>
  <div class="modal-title" id="modal-title"></div>
  <div class="modal-body" id="modal-body"></div>
  <div class="modal-footer" id="modal-footer"></div>
</div>

<div class="overlay" id="manage-overlay" onclick="closeManage()"></div>
<div class="drawer" id="manage-drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title" id="manage-title"></div>
  <div class="drawer-body" id="manage-body"></div>
  <div class="drawer-footer"><button class="d-act d-act-primary" onclick="closeManage()">Fechar</button></div>
</div>

const REST_COMPANHIAS=["Solo","A dois","Turma","Família"];
const REST_PRECOS=["Barato","Bom preço","Mid","Caro","Muito caro"];
const BAR_TIPOS=["Barzinho","Bar sofisticado"];

const WINE_TIPOS=["Tinto","Branco","Espumante","Rosé","Laranja","Sobremesa"];
const WINE_STATUS=["Quero experimentar","Já provei","Quero de novo","Não voltaria"];
const WINE_STATUS_STYLE={"Quero experimentar":"spill-quer","Já provei":"spill-foi","Quero de novo":"spill-volta","Não voltaria":"spill-nao"};
const WINE_COLOR={"Tinto":"#8B1A4A","Branco":"#C9A84C","Espumante":"#D4AC0D","Rosé":"#E8622A","Laranja":"#E67E22","Sobremesa":"#7D3C98"};
const WINE_ICON={"Tinto":"🍷","Branco":"🥂","Espumante":"🍾","Rosé":"🌸","Laranja":"🍊","Sobremesa":"✨"};

const WHIS_STATUS_STYLE={"Quero experimentar":"spill-quer","Já provei":"spill-foi","Quero de novo":"spill-volta","Não voltaria":"spill-nao"};

const REST_KEY='mesas_rest_v1';
const WINE_KEY='mesas_wine_v1';
const WHIS_KEY='mesas_whis_v1';
const PREF_KEY='mesas_prefs_v1';

// ── STATE ────────────────────────────────────────────────────────────────────
let currentApp='rest'; // rest | wine | whis

let activeTab='Todos';
let search='';
let drawerKey=null;
let manageMode=null;
let editId=null;

// ── LOAD DATA ────────────────────────────────────────────────────────────────
function loadRest(){
  let d=JSON.parse(localStorage.getItem(REST_KEY)||'null');
  if(!d){
    // load from backup
    d=BACKUP_REST.map((r,i)=>({...r,id:r.id!==undefined?r.id:i}));
  }
  d.forEach(r=>{
    for(const f of ['periodo','vibe','companhia','status'])if(!Array.isArray(r[f]))r[f]=[];
    if(!r.status.length)r.status=['Quero conhecer'];
    if(!r.obs)r.obs='';if(!r.vibeCustom)r.vibeCustom='';if(!r.barTipo)r.barTipo='';
    if(!r.cidade)r.cidade='São Paulo';if(!r.preco)r.preco='Bom preço';
    if(r.priority===undefined)r.priority=false;
  });
  return d;
}
function loadWine(){
  let d=JSON.parse(localStorage.getItem(WINE_KEY)||'null');
  if(!d)d=[];
  d.forEach(r=>{if(!Array.isArray(r.status))r.status=['Quero experimentar'];if(r.obs===undefined)r.obs='';});
  return d;
}
function loadWhis(){
  let d=JSON.parse(localStorage.getItem(WHIS_KEY)||'null');
  if(!d)d=[];
  d.forEach(r=>{if(!Array.isArray(r.status))r.status=['Quero experimentar'];if(r.obs===undefined)r.obs='';});
  return d;
}
function loadPrefs(){
  let p=JSON.parse(localStorage.getItem(PREF_KEY)||'null');
  if(!p)p={restSort:'priority',wineSort:'az',whisSort:'az',catsCustom:[],vibesCustom:[],catsColors:{},catsIcons:{},catsHidden:[]};
  if(!p.catsCustom)p.catsCustom=[];if(!p.vibesCustom)p.vibesCustom=[];
  if(!p.catsColors)p.catsColors={};if(!p.catsIcons)p.catsIcons={};
  if(!p.catsHidden)p.catsHidden=[];
  return p;
}

// inject default prefs if first run
(function(){
  const _p = JSON.parse(localStorage.getItem('mesas_prefs_v1')||'null');
  if(!_p){
    localStorage.setItem('mesas_prefs_v1', JSON.stringify({"restSort": "rating", "wineSort": "az", "whisSort": "az", "catsCustom": ["Italiano", "Francesa"], "vibesCustom": [], "catsColors": {"Italiano": "#2C3E50", "Francesa": "#16A085"}, "catsIcons": {"Italiano": "🍝", "Francesa": "🥐"}, "catsHidden": []}));
  } else {
    let changed = false;
    const customs = ["Italiano", "Francesa"];
    const colors = {"Italiano": "#2C3E50", "Francesa": "#16A085"};
    const icons = {"Italiano": "🍝", "Francesa": "🥐"};
    if(!_p.catsCustom) _p.catsCustom = [];
    if(!_p.catsColors) _p.catsColors = {};
    if(!_p.catsIcons) _p.catsIcons = {};
    customs.forEach(c => {
      if(!_p.catsCustom.includes(c)) { _p.catsCustom.push(c); changed = true; }
      if(!_p.catsColors[c]) { _p.catsColors[c] = colors[c]; changed = true; }
      if(!_p.catsIcons[c]) { _p.catsIcons[c] = icons[c]; changed = true; }
    });
    if(changed) localStorage.setItem('mesas_prefs_v1', JSON.stringify(_p));
  }
})();
let restData=loadRest();
let wineData=loadWine();
let whisData=loadWhis();
let prefs=loadPrefs();

let restSort=prefs.restSort||'priority';
let wineSort=prefs.wineSort||'az';
let whisSort=prefs.whisSort||'az';

function restNextId(){return Math.max(0,...restData.map(r=>r.id||0))+1;}
function wineNextId(){return Math.max(0,...wineData.map(r=>r.id||0))+1;}
function whisNextId(){return Math.max(0,...whisData.map(r=>r.id||0))+1;}

function saveRest(){localStorage.setItem(REST_KEY,JSON.stringify(restData));}
function saveWine(){localStorage.setItem(WINE_KEY,JSON.stringify(wineData));}
function saveWhis(){localStorage.setItem(WHIS_KEY,JSON.stringify(whisData));}
function savePrefs(){localStorage.setItem(PREF_KEY,JSON.stringify(prefs));}

// ── FILTERS STATE ─────────────────────────────────────────────────────────────
let restFilters={cidade:[],status:[],periodo:[],vibe:[],companhia:[],preco:[],barTipo:[]};
let wineFilters={tipo:[],status:[],pais:[],regiao:[]};
let whisFilters={tipo:[],status:[]};
function getFilters(){return currentApp==='rest'?restFilters:currentApp==='wine'?wineFilters:whisFilters;}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/'/g,"\'");}
function getAllRestCats(){return[...REST_CATS_DEFAULT,...prefs.catsCustom.filter(c=>!REST_CATS_DEFAULT.includes(c))].filter(c=>!(prefs.catsHidden||[]).includes(c));}
function getAllVibes(){return[...REST_VIBES_DEFAULT,...prefs.vibesCustom.filter(v=>!REST_VIBES_DEFAULT.includes(v))];}
function getCatColor(c){return(prefs.catsColors&&prefs.catsColors[c])||REST_CAT_COLOR[c]||'#6C6C6C';}
function getCatIcon(c){return(prefs.catsIcons&&prefs.catsIcons[c])||REST_CAT_ICON[c]||'🍽';}
function filterCount(){return Object.values(getFilters()).reduce((s,a)=>s+a.length,0);}
function getCidades(){return[...new Set(restData.map(r=>r.cidade||'São Paulo'))].sort();}
function getWinePaises(){return[...new Set(wineData.map(r=>r.pais).filter(Boolean))].sort();}
function getWineRegioes(){return[...new Set(wineData.map(r=>r.regiao).filter(Boolean))].sort();}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────
function exportJSON(){
  const payload={rest:restData,wine:wineData,whis:whisData,prefs};
  const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='eat_drink_backup.json';a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      // support old restaurantes-only backup
      if(Array.isArray(p)){restData=p;saveRest();}
      else if(p.data&&Array.isArray(p.data)){restData=p.data;if(p.prefs&&p.prefs.catsCustom)prefs.catsCustom=p.prefs.catsCustom;saveRest();savePrefs();}
      else{
        if(p.rest)restData=p.rest;
        if(p.wine)wineData=p.wine;
        if(p.whis)whisData=p.whis;
        if(p.prefs)prefs=p.prefs;
        saveRest();saveWine();saveWhis();savePrefs();
      }
      goHome();alert('Importado!');
    }catch{alert('Arquivo inválido.');}
  };
  r.readAsText(f);e.target.value='';
}

  document.getElementById('home-view').classList.remove('hidden');
  document.getElementById('list-view').classList.add('hidden');
  inListView=false;
  if(currentApp==='rest')buildRestHome();
  else if(currentApp==='wine')buildWineHome();

  const total=restData.length,visited=restData.filter(r=>r.status.includes('Já fui')).length;

function openCat(cat){
  activeTab=cat;
  const f=getFilters();Object.keys(f).forEach(k=>f[k]=[]);
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');

  buildFilters();render();
}
function goHome(){search='';document.getElementById('search').value='';buildHome();}

// ── FILTER GROUPS ─────────────────────────────────────────────────────────────
function getFilterGroups(){
  if(currentApp==='rest'){
    const g=[
      {key:'status',label:'Status',opts:()=>REST_STATUS},
      {key:'periodo',label:'Período',opts:()=>['café/brunch','almoço','jantar','ambos']},
      {key:'vibe',label:'Vibe',opts:()=>getAllVibes()},
      {key:'companhia',label:'Companhia',opts:()=>REST_COMPANHIAS},
      {key:'preco',label:'Preço',opts:()=>REST_PRECOS},
    ];
    if(activeTab==='Bar & Boteco'||activeTab==='Todos')g.push({key:'barTipo',label:'Tipo de bar',opts:()=>BAR_TIPOS});
    if(getCidades().length>1)g.unshift({key:'cidade',label:'Cidade',opts:()=>getCidades()});
    return g;
  }
  if(currentApp==='wine'){
    const g=[{key:'status',label:'Status',opts:()=>WINE_STATUS},{key:'tipo',label:'Tipo',opts:()=>WINE_TIPOS}];
    if(getWinePaises().length>0)g.push({key:'pais',label:'País',opts:()=>getWinePaises()});
    if(getWineRegioes().length>0)g.push({key:'regiao',label:'Região',opts:()=>getWineRegioes()});
    return g;
  }
  return[{key:'status',label:'Status',opts:()=>WHIS_STATUS},{key:'tipo',label:'Tipo',opts:()=>WHIS_TIPOS}];
}

function buildFilters(){
  const cnt=filterCount();
  document.getElementById('filters-wrap').innerHTML=
    getFilterGroups().map(g=>{const n=getFilters()[g.key]?getFilters()[g.key].length:0;
      return`<button class="f-btn${n?' on':''}" onclick="openDrawer('${g.key}')">
        ${n?'<span class="f-dot"></span>':''}${g.label}${n?` (${n})`:''}
      </button>`;
    }).join('')+(cnt?`<button class="f-clear" onclick="clearAllFilters()">✕</button>`:'');
}

function openDrawer(key){
  drawerKey=key;
  const g=getFilterGroups().find(x=>x.key===key);
  document.getElementById('drawer-title').textContent=g?g.label:'';
  buildDrawerBody();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  buildFilters();render();
}
function clearAllFilters(){const f=getFilters();Object.keys(f).forEach(k=>f[k]=[]);buildDrawerBody();buildFilters();render();}
function clearGroupFilter(){if(drawerKey){getFilters()[drawerKey]=[];}buildDrawerBody();}
function buildDrawerBody(){
  const g=getFilterGroups().find(x=>x.key===drawerKey);if(!g)return;
  const f=getFilters();
  document.getElementById('drawer-body').innerHTML=`<div class="d-chips">${g.opts().map(o=>`<span class="dchip${(f[g.key]||[]).includes(o)?' on':''}" onclick="toggleF('${g.key}','${esc(o)}')">${o}</span>`).join('')}</div>`;
}
function toggleF(key,val){const f=getFilters();if(!f[key])f[key]=[];const a=f[key],i=a.indexOf(val);if(i>-1)a.splice(i,1);else a.push(val);buildDrawerBody();}

// ── SORT ──────────────────────────────────────────────────────────────────────
function cycleSort(){
  const modes=currentApp==='rest'?['priority','az','za','rating']:['az','za','rating'];
  const labels={priority:'Prioridade',az:'A–Z',za:'Z–A',rating:'Nota'};
  let cur=currentApp==='rest'?restSort:currentApp==='wine'?wineSort:whisSort;
  const i=modes.indexOf(cur);cur=modes[(i+1)%modes.length];
  if(currentApp==='rest'){restSort=cur;prefs.restSort=cur;}
  else if(currentApp==='wine'){wineSort=cur;prefs.wineSort=cur;}
  else{whisSort=cur;prefs.whisSort=cur;}
  savePrefs();
  document.getElementById('sort-lbl').textContent=labels[cur];
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const sortLabels={priority:'Prioridade',az:'A–Z',za:'Z–A',rating:'Nota'};
  const curSort=currentApp==='rest'?restSort:currentApp==='wine'?wineSort:whisSort;
  document.getElementById('sort-lbl').textContent=sortLabels[curSort]||'A–Z';
  if(currentApp==='rest')renderRest();
  else if(currentApp==='wine')renderWine();
  else renderWhis();
}

function sortList(list,s){
  return[...list].sort((a,b)=>{
    if(s==='priority'){if(b.priority!==a.priority)return b.priority?1:-1;return(b.r||0)-(a.r||0);}
    if(s==='az')return a.n.localeCompare(b.n,'pt');
    if(s==='za')return b.n.localeCompare(a.n,'pt');
    return(b.r||0)-(a.r||0);
  });
}

function renderRest(){
  const f=restFilters;
  let list=restData.filter(r=>{
    if(activeTab!=='Todos'&&r.c!==activeTab)return false;
    if(search&&!r.n.toLowerCase().includes(search.toLowerCase()))return false;
    if(f.cidade&&f.cidade.length&&!f.cidade.includes(r.cidade||'São Paulo'))return false;
    if(f.status.length&&!f.status.some(x=>r.status.includes(x)))return false;
    if(f.periodo.length&&r.periodo&&r.periodo.length&&!f.periodo.some(x=>r.periodo.includes(x)))return false;
    const allV=[...(r.vibe||[]),r.vibeCustom].filter(Boolean);
    if(f.vibe.length&&allV.length&&!f.vibe.some(x=>allV.includes(x)))return false;
    if(f.companhia.length&&r.companhia&&r.companhia.length&&!f.companhia.some(x=>r.companhia.includes(x)))return false;
    if(f.preco.length&&!f.preco.includes(r.preco))return false;
    if(f.barTipo&&f.barTipo.length&&!f.barTipo.includes(r.barTipo))return false;
    return true;
  });
  list=sortList(list,restSort);
  document.getElementById('list-count').innerHTML=`<strong>${activeTab==='Todos'?'Todos':activeTab}</strong> · ${list.length} lugar${list.length!==1?'es':''}`;
  const el=document.getElementById('cards');
  if(!list.length){el.innerHTML=`<div class="empty">Nenhum lugar encontrado.</div>`;return;}
  el.innerHTML=list.map(r=>{
    const cc=getCatColor(r.c);
    const isQC=r.status.length===1&&r.status[0]==='Quero conhecer';
    const allVibes=[...(r.vibe||[]),r.vibeCustom].filter(Boolean);
    const statusHtml=r.status.map(s=>`<span class="spill ${REST_STATUS_STYLE[s]||''}">${s}</span>`).join('');
    const tags=isQC?[]:[...(r.periodo||[]),...allVibes,...(r.companhia||[]),r.preco].filter(Boolean);
    const barTag=!isQC&&r.barTipo?`<span class="ctag">${r.barTipo}</span>`:'';
    const cidTag=r.cidade&&r.cidade!=='São Paulo'?`<span class="ctag ctag-dest">${r.cidade}</span>`:'';
    const scoreHtml=!isQC&&r.r?`<span class="card-score">${r.r}/10</span>`:'';
    return`<div class="card${r.priority?' priority':''}" onclick="openEdit(${r.id})">
      <div class="card-stripe" style="background:${cc}"></div>
      <div class="card-body">
        <div class="card-row1">
          <div class="card-name">${r.priority?'<span class="priority-icon">★</span>':''} ${r.n}</div>
          <div>${scoreHtml}</div>
        </div>
        <div class="card-status-pills">${statusHtml}</div>
        ${tags.length||barTag||cidTag?`<div class="card-tags">${barTag}${tags.map(t=>`<span class="ctag">${t}</span>`).join('')}${cidTag}</div>`:''}
        ${!isQC&&r.obs?`<div class="card-obs">${r.obs}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderWine(){
  const f=wineFilters;
  let list=wineData.filter(r=>{
    if(activeTab!=='Todos'&&r.tipo!==activeTab)return false;
    if(search&&!r.n.toLowerCase().includes(search.toLowerCase()))return false;
    if(f.status&&f.status.length&&!f.status.some(x=>r.status.includes(x)))return false;
    if(f.tipo&&f.tipo.length&&!f.tipo.includes(r.tipo))return false;
    if(f.pais&&f.pais.length&&!f.pais.includes(r.pais))return false;
    if(f.regiao&&f.regiao.length&&!f.regiao.includes(r.regiao))return false;
    return true;
  });
  list=sortList(list,wineSort);
  document.getElementById('list-count').innerHTML=`<strong>${activeTab==='Todos'?'Vinhos':activeTab}</strong> · ${list.length}`;
  const el=document.getElementById('cards');
  if(!list.length){el.innerHTML=`<div class="empty">Nenhum vinho encontrado.</div>`;return;}
  el.innerHTML=list.map(r=>{
    const isQE=r.status.length===1&&r.status[0]==='Quero experimentar';
    const cc=WINE_COLOR[r.tipo]||'#8B1A4A';
    const statusHtml=r.status.map(s=>`<span class="spill ${WINE_STATUS_STYLE[s]||''}">${s}</span>`).join('');
    const tags=[];
    if(!isQE){
      if(r.safra)tags.push(r.safra);
      if(r.produtor)tags.push(r.produtor);
      if(r.pais)tags.push(r.pais);
      if(r.regiao)tags.push(r.regiao);
      if(r.uva)tags.push(r.uva);
      if(r.teor)tags.push(r.teor+'%');
    }
    const scoreHtml=!isQE&&r.r?`<span class="card-score">${r.r}/10</span>`:'';
    return`<div class="card" onclick="openEdit(${r.id})">
      <div class="card-stripe" style="background:${cc}"></div>
      <div class="card-body">
        <div class="card-row1">
          <div class="card-name">${r.n}</div>
          <div>${scoreHtml}</div>
        </div>
        <div class="card-status-pills">${statusHtml}</div>
        ${tags.length?`<div class="card-tags">${tags.map(t=>`<span class="ctag">${t}</span>`).join('')}</div>`:''}

      </div>
    </div>`;

}

function renderWhis(){
  const f=whisFilters;
  let list=whisData.filter(r=>{
    if(activeTab!=='Todos'&&r.tipo!==activeTab)return false;
    if(search&&!r.n.toLowerCase().includes(search.toLowerCase()))return false;
    if(f.status&&f.status.length&&!f.status.some(x=>r.status.includes(x)))return false;
    if(f.tipo&&f.tipo.length&&!f.tipo.includes(r.tipo))return false;
    return true;
  });
  list=sortList(list,whisSort);
  document.getElementById('list-count').innerHTML=`<strong>${activeTab==='Todos'?'Whiskies':activeTab}</strong> · ${list.length}`;
  const el=document.getElementById('cards');
  if(!list.length){el.innerHTML=`<div class="empty">Nenhum whisky encontrado.</div>`;return;}
  el.innerHTML=list.map(r=>{
    const isQE=r.status.length===1&&r.status[0]==='Quero experimentar';
    const statusHtml=r.status.map(s=>`<span class="spill ${WHIS_STATUS_STYLE[s]||''}">${s}</span>`).join('');
    const tags=[];
    if(!isQE){
      if(r.tipo)tags.push(r.tipo);
      if(r.origem)tags.push(r.origem);
      if(r.idade)tags.push(r.idade+' anos');
    }
    const scoreHtml=!isQE&&r.r?`<span class="card-score">${r.r}/10</span>`:'';
    return`<div class="card" onclick="openEdit(${r.id})">
      <div class="card-stripe" style="background:#C27C0E"></div>
      <div class="card-body">
        <div class="card-row1">
          <div class="card-name">${r.n}</div>
          <div>${scoreHtml}</div>
        </div>
        <div class="card-status-pills">${statusHtml}</div>
        ${tags.length?`<div class="card-tags">${tags.map(t=>`<span class="ctag">${t}</span>`).join('')}</div>`:''}
        ${!isQE&&r.obs?`<div class="card-obs">${r.obs}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderFooter(isNew,id){

    +`<button class="m-act" onclick="closeModal()" style="${isNew?'margin-left:auto':''}">Cancelar</button>

function togM(el){
  const f=el.dataset.f,v=el.dataset.v;
  if(!Array.isArray(window._md[f]))window._md[f]=[];
  const a=window._md[f],i=a.indexOf(v);
  if(i>-1)a.splice(i,1);else a.push(v);
  el.classList.toggle('sel-m',window._md[f].includes(v));
}
function togS(el){
  const f=el.dataset.f,v=el.dataset.v;
  el.closest('.mchips').querySelectorAll('.mchip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');window._md[f]=v;
}

    </div>`:''}
    <div class="add-custom-row">
      <input class="add-custom-input" id="manage-input" placeholder="${isC?'Nova categoria...':'Nova vibe...'}" onkeydown="if(event.key==='Enter')addCustom()">
      <button class="add-custom-btn" onclick="addCustom()">+</button>
    </div>`;
}
function addCustom(){
  const input=document.getElementById('manage-input');
  const val=input.value.trim();if(!val)return;
  const isC=manageMode==='cats';
  if(isC){
    if((prefs.catsHidden||[]).includes(val)){restoreCustom(val);input.value='';return;}
    if(!prefs.catsCustom.includes(val)&&!REST_CATS_DEFAULT.includes(val)){
      openCatCustomizer(val);return;
    }
  } else {
    if(!prefs.vibesCustom.includes(val)&&!REST_VIBES_DEFAULT.includes(val))prefs.vibesCustom.push(val);
    savePrefs();input.value='';buildManageBody();if(inListView)buildFilters();else buildHome();
  }
}
function removeCustom(val){
  const isC=manageMode==='cats';
  if(isC){
    if(REST_CATS_DEFAULT.includes(val)){if(!prefs.catsHidden)prefs.catsHidden=[];if(!prefs.catsHidden.includes(val))prefs.catsHidden.push(val);}
    else prefs.catsCustom=prefs.catsCustom.filter(v=>v!==val);
  } else {
    prefs.vibesCustom=prefs.vibesCustom.filter(v=>v!==val);
  }
  savePrefs();buildManageBody();if(inListView)buildFilters();else buildHome();
}
function restoreCustom(val){
  prefs.catsHidden=(prefs.catsHidden||[]).filter(v=>v!==val);
  savePrefs();buildManageBody();if(inListView)buildFilters();else buildHome();
}

function openCatCustomizer(nome){
  const CORES=['#E8622A','#C0392B','#8E44AD','#2980B9','#E74C3C','#E67E22','#7D3C98','#1A7F6E','#D4AC0D','#27AE60','#E91E8C','#2C3E50','#16A085','#D35400','#6C3483'];
  const ICONS=['🍕','🍔','🍝','🦞','🍣','🥢','🥩','✨','🍺','☕','🍨','📦','🍽','🥗','🌮','🍜','🫕','🥘','🍱','🍷','🧁','🍰','🥐','🌯','🫙'];
  window._custColor=CORES[0];window._custIcon=ICONS[0];
  const bd=document.createElement('div');
  bd.id='cat-customizer';
  bd.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;backdrop-filter:blur(4px)';
  bd.innerHTML=`<div onclick="event.stopPropagation()" style="background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;padding-bottom:36px">
    <div style="width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px"></div>
    <div style="font-size:17px;font-weight:700;margin-bottom:16px">Personalizar "${nome}"</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">Cor</div>
    <div id="cust-colors" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
      ${CORES.map((c,i)=>`<div onclick="selCustColor('${c}',this)" style="width:36px;height:36px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${i===0?'#fff':'transparent'}">${''}</div>`).join('')}
    </div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px">Ícone</div>
    <div id="cust-icons" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px">
      ${ICONS.map((ic,i)=>`<div onclick="selCustIcon('${ic}',this)" style="width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid ${i===0?'var(--accent)':'transparent'}">${ic}</div>`).join('')}
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="document.body.removeChild(document.getElementById('cat-customizer'))" style="flex:1;padding:14px;border-radius:13px;font-size:16px;font-weight:600;border:none;background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif">Cancelar</button>
      <button onclick="confirmCatCustomizer('${nome.replace(/'/g,"\'")}',document.getElementById('cat-customizer'))" style="flex:1;padding:14px;border-radius:13px;font-size:16px;font-weight:600;border:none;background:var(--accent);color:#fff;cursor:pointer;font-family:'Inter',sans-serif">Adicionar</button>
    </div>
  </div>`;
  bd.onclick=()=>{if(document.getElementById('cat-customizer'))document.body.removeChild(bd);};
  document.body.appendChild(bd);
}
function selCustColor(c,el){window._custColor=c;document.querySelectorAll('#cust-colors div').forEach(d=>d.style.borderColor='transparent');el.style.borderColor='#fff';}
function selCustIcon(ic,el){window._custIcon=ic;document.querySelectorAll('#cust-icons div').forEach(d=>d.style.borderColor='transparent');el.style.borderColor='var(--accent)';}
function confirmCatCustomizer(nome,bd){
  if(!prefs.catsColors)prefs.catsColors={};if(!prefs.catsIcons)prefs.catsIcons={};
  prefs.catsCustom.push(nome);prefs.catsColors[nome]=window._custColor;prefs.catsIcons[nome]=window._custIcon;
  savePrefs();document.body.removeChild(bd);
  const inp=document.getElementById('manage-input');if(inp)inp.value='';
  buildManageBody();if(inListView)buildFilters();else buildHome();
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input',e=>{
  search=e.target.value;
  if(search&&!inListView){
    activeTab='Todos';
    document.getElementById('home-view').classList.add('hidden');
    document.getElementById('list-view').classList.remove('hidden');
    inListView=true;buildFilters();
  }
  if(!search&&inListView){goHome();return;}
  if(inListView)render();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
buildHome();
</script>
</body>
</html>
