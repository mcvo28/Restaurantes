<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Restaurantes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#111;--surface:#1C1C1E;--surface2:#2C2C2E;--border:#3A3A3C;
  --text:#F2F2F7;--text2:#8E8E93;--text3:#48484A;
  --accent:#E8622A;--green:#34C759;--red:#FF3B30;--gold:#F0A500;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding-bottom:48px}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:10px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.4px}
.topbar-right{display:flex;gap:8px}
.tbtn{background:var(--surface2);border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.tbtn-accent{background:var(--accent);color:#fff}

.search-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px}
.search-wrap{position:relative}
.search-wrap input{width:100%;background:var(--surface2);border:none;border-radius:10px;padding:10px 14px 10px 36px;font-size:15px;color:var(--text);font-family:'Inter',sans-serif;outline:none}
.search-wrap input::placeholder{color:var(--text3)}
.s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:17px;pointer-events:none}

.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px}
.filter-wrap{display:flex;flex-wrap:wrap;gap:7px}
.f-btn{display:flex;align-items:center;gap:5px;background:var(--surface2);border:none;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.f-btn.on{background:rgba(232,98,42,.15);color:var(--accent)}
.f-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.f-clear{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;padding:8px 4px}

.home-view{padding:16px}
.home-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.home-title{font-size:20px;font-weight:700;letter-spacing:-.4px}
.home-sub{font-size:13px;color:var(--text2)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-card{border-radius:16px;padding:18px 16px;cursor:pointer;position:relative;overflow:hidden;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.06);transition:transform .15s,opacity .15s}
.cat-card:active{transform:scale(.97);opacity:.85}
.cat-card-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px;line-height:1.2}
.cat-card-count{font-size:12px;color:rgba(255,255,255,.65);font-weight:500}
.cat-card-icon{font-size:28px;position:absolute;right:14px;top:14px;opacity:.35}
.cat-card-todos{grid-column:1/-1;min-height:70px;flex-direction:row;align-items:center;gap:12px}
.cat-card-todos .cat-card-icon{position:static;opacity:.5;font-size:24px}

.list-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.list-count{font-size:13px;color:var(--text2)}
.list-count strong{color:var(--text);font-weight:600}
.list-back{background:none;border:none;font-size:13px;color:var(--accent);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;padding:0}
.sort-btn{background:none;border:none;font-size:13px;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.list-header-left{display:flex;align-items:center;gap:10px}

.cards{padding:0 16px}
.card{background:var(--surface);border-radius:14px;margin-bottom:10px;overflow:hidden;cursor:pointer;display:flex;border:1px solid var(--border);transition:border-color .15s}
.card:active{opacity:.7}
.card.priority{border-color:var(--accent);border-width:2px}
.card-stripe{width:4px;flex-shrink:0}
.card-body{flex:1;padding:13px 14px;min-width:0}
.card-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px}
.card-name{font-size:16px;font-weight:600;letter-spacing:-.3px;line-height:1.25;display:flex;align-items:center;gap:6px}
.priority-icon{color:var(--accent);font-size:13px}
.card-score{font-size:13px;font-weight:700;color:var(--gold)}
.card-status-pills{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.spill{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:500}
.spill-foi{background:rgba(52,199,89,.15);color:#34C759}
.spill-quer{background:rgba(232,98,42,.12);color:var(--accent)}
.spill-volta{background:rgba(240,165,0,.15);color:var(--gold)}
.spill-nao{background:rgba(255,59,48,.12);color:var(--red)}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.ctag{font-size:12px;padding:3px 9px;border-radius:8px;background:var(--surface2);color:var(--text2)}
.ctag-cidade{background:rgba(142,68,173,.15);color:#C39BD3}
.card-obs{font-size:12px;color:var(--text3);font-style:italic;margin-top:4px}
.empty{padding:60px 20px;text-align:center;color:var(--text3);font-size:15px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;backdrop-filter:blur(4px)}
.overlay.show{display:block}
.drawer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:101;max-height:85vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
.drawer.show{transform:translateY(0)}
.drawer-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px;flex-shrink:0}
.drawer-title{font-size:17px;font-weight:700;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-body{overflow-y:auto;padding:20px;flex:1;-webkit-overflow-scrolling:touch}
.drawer-body::-webkit-scrollbar{display:none}
.d-chips{display:flex;flex-wrap:wrap;gap:10px}
.dchip{font-size:14px;font-weight:500;padding:10px 18px;border-radius:22px;border:1.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.dchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.drawer-footer{display:flex;gap:10px;padding:14px 20px 36px;border-top:1px solid var(--border);flex-shrink:0}
.d-act{flex:1;padding:13px;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none;background:var(--surface2);color:var(--text2)}
.d-act-primary{background:var(--accent);color:#fff}

.menu-drawer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:101;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
.menu-drawer.show{transform:translateY(0)}
.menu-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px}
.menu-item{display:flex;align-items:center;gap:14px;padding:16px 24px;border:none;background:none;font-family:'Inter',sans-serif;font-size:16px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;width:100%;border-top:1px solid var(--border)}
.menu-item:first-of-type{border-top:none}
.menu-spacer{height:36px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;backdrop-filter:blur(4px)}
.modal-overlay.show{display:block}
.modal{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:201;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
.modal.show{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px;flex-shrink:0}
.modal-title{font-size:17px;font-weight:700;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-body{overflow-y:auto;padding:16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.modal-body::-webkit-scrollbar{display:none}
.mfield{margin-bottom:16px}
.mfield label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:8px}
.mfield label span{text-transform:none;font-weight:400;color:var(--text3)}
.mfield input,.mfield select,.mfield textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);padding:11px 14px;font-size:15px;font-family:'Inter',sans-serif;outline:none}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{border-color:var(--accent)}
.mfield textarea{resize:none;height:72px;line-height:1.5}
.mfield select option{background:var(--surface2)}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{font-size:14px;font-weight:500;padding:9px 16px;border-radius:22px;border:1.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}
.mchip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.mchip.sel-m{border-color:var(--accent);color:var(--accent);background:rgba(232,98,42,.12)}
.mchip-del{font-size:12px;padding:7px 10px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:5px}
.mchip-del:hover{border-color:var(--red);color:var(--red)}
.add-custom-row{display:flex;gap:8px;margin-top:10px}
.add-custom-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif;outline:none}
.add-custom-input:focus{border-color:var(--accent)}
.add-custom-btn{background:var(--accent);border:none;border-radius:12px;color:#fff;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.score-wrap{display:flex;align-items:center;gap:12px}
.score-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--surface2);outline:none}
.score-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);cursor:pointer}
.score-val{font-size:20px;font-weight:700;color:var(--gold);min-width:28px;text-align:center}
.priority-toggle{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:12px;padding:12px 16px;cursor:pointer;border:1.5px solid var(--border)}
.priority-toggle.on{border-color:var(--accent);background:rgba(232,98,42,.1)}
.priority-toggle-label{font-size:15px;font-weight:500;color:var(--text2);flex:1}
.priority-toggle.on .priority-toggle-label{color:var(--text)}
.priority-toggle-icon{font-size:20px}
.modal-footer{flex-shrink:0;padding:12px 20px 36px;border-top:1px solid var(--border);display:flex;gap:10px}
.m-act{flex:1;padding:14px;border-radius:13px;font-size:16px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none;background:var(--surface2);color:var(--text2)}
.m-act-primary{background:var(--accent);color:#fff}
.m-act-danger{background:rgba(255,59,48,.1);color:var(--red)}
.cidade-sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.csug{font-size:13px;padding:5px 12px;border-radius:12px;background:var(--surface2);color:var(--text2);cursor:pointer;border:none;font-family:'Inter',sans-serif}
.hidden{display:none!important}
.section-divider{height:1px;background:var(--border);margin:4px 0 16px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🍽 Restaurantes</div>
  <div class="topbar-right">
    <button class="tbtn tbtn-accent" onclick="openAdd()">+ Novo</button>
    <button class="tbtn" onclick="openMenu()">⋯</button>
  </div>
</div>

<div class="search-bar">
  <div class="search-wrap">
    <span class="s-icon">⌕</span>
    <input type="text" id="search" placeholder="Buscar restaurante..." autocomplete="off">
  </div>
</div>

<div id="home-view">
  <div class="home-view">
    <div class="home-header">
      <div>
        <div class="home-title">Comidas</div>
        <div class="home-sub" id="home-sub"></div>
      </div>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>
</div>

<div id="list-view" class="hidden">
  <div class="filter-bar">
    <div class="filter-wrap" id="filters-wrap"></div>
  </div>
  <div class="list-header">
    <div class="list-header-left">
      <button class="list-back" onclick="goHome()">← Voltar</button>
      <div class="list-count" id="list-count"></div>
    </div>
    <button class="sort-btn" onclick="cycleSort()">↕ <span id="sort-lbl">Prioridade</span></button>
  </div>
  <div class="cards" id="cards"></div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title" id="drawer-title"></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer">
    <button class="d-act" onclick="clearGroupFilter()">Limpar</button>
    <button class="d-act d-act-primary" onclick="closeDrawer()">Ver resultados</button>
  </div>
</div>

<div class="overlay" id="menu-overlay" onclick="closeMenu()"></div>
<div class="menu-drawer" id="menu-drawer">
  <div class="menu-handle"></div>
  <button class="menu-item" onclick="exportJSON();closeMenu()">↓ Exportar backup (.json)</button>
  <label class="menu-item" style="cursor:pointer">↑ Importar backup (.json)
    <input type="file" accept=".json" style="display:none" onchange="importJSON(event);closeMenu()">
  </label>
  <button class="menu-item" onclick="openManageCategories();closeMenu()">✎ Gerenciar categorias</button>
  <button class="menu-item" onclick="openManageVibes();closeMenu()">✎ Gerenciar vibes</button>
  <div class="menu-spacer"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-handle"></div>
  <div class="modal-title" id="modal-title"></div>
  <div class="modal-body" id="modal-body"></div>
  <div class="modal-footer" id="modal-footer"></div>
</div>

<div class="overlay" id="manage-overlay" onclick="closeManage()"></div>
<div class="drawer" id="manage-drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title" id="manage-title"></div>
  <div class="drawer-body" id="manage-body"></div>
  <div class="drawer-footer">
    <button class="d-act d-act-primary" onclick="closeManage()">Fechar</button>
  </div>
</div>

<script>

function migrateVibe(v){
  if(!v)return[];
  const m={"casual":"Casual","animado":"Animado","romântico":"Romântico","bar diurno":"Boteco","bar noturno":"Animado","especial":"Ocasião especial","romantico":"Romântico"};
  if(Array.isArray(v))return[...new Set(v.map(x=>m[x]||x))];
  return[m[v]||v];
}
function migrateCat(c){
  const m={"Pizzas":"Pizza","Hamburgueria":"Hambúrguer","Sushi/Japonês":"Japonês","Restaurantes":"Outros","Bares":"Bar & Boteco","Café/Padaria":"Café & Padaria","Delivery":"Delivery","Sobremesa":"Sobremesa"};
  return m[c]||c;
}
function migratePreco(p){
  const m={"$":"Barato","$$":"Bom preço","$$$":"Caro"};
  return m[p]||p||"Bom preço";
}
function migrateCompanhia(o){
  if(Array.isArray(o)){
    const m={"amigos":"Turma","encontro":"A dois","família":"Família","familia":"Família"};
    return[...new Set(o.map(x=>m[x]||x))];
  }
  return[];
}

const KEY='comidas_v8';
const PREF_KEY='comidas_prefs_v8';
let data=JSON.parse(localStorage.getItem(KEY)||'null');
let prefs=JSON.parse(localStorage.getItem(PREF_KEY)||'null')||{sort:'priority',catsCustom:[],vibesCustom:[]};

if(!data){
  const old=JSON.parse(localStorage.getItem('comidas_v7')||localStorage.getItem('comidas_v6')||localStorage.getItem('comidas_v4')||'null');
  if(old){
    data=old.map(r=>({
      n:r.n,c:migrateCat(r.c),barTipo:r.barTipo||'',cidade:r.cidade||'São Paulo',
      status:r.status?r.status:(r.v?["Já fui"]:["Quero conhecer"]),
      r:Math.min(10,r.r||0),
      periodo:Array.isArray(r.periodo)?r.periodo:[],
      vibe:migrateVibe(r.vibe),vibeCustom:r.vibeCustom||'',
      companhia:Array.isArray(r.companhia)?migrateCompanhia(r.companhia):[],
      preco:migratePreco(r.preco),obs:r.obs||'',priority:r.priority||false,id:r.id,
    }));
  } else {
    data=DEFAULT.map((d,i)=>({...d,id:i}));
  }
}
data.forEach(r=>{
  if(!r.cidade)r.cidade='São Paulo';
  if(!Array.isArray(r.periodo))r.periodo=[];
  if(!Array.isArray(r.vibe))r.vibe=[];
  if(!Array.isArray(r.companhia))r.companhia=[];
  if(!Array.isArray(r.status))r.status=['Quero conhecer'];
  if(r.obs===undefined)r.obs='';
  if(r.vibeCustom===undefined)r.vibeCustom='';
  if(r.priority===undefined)r.priority=false;
  if(r.barTipo===undefined)r.barTipo='';
  if(!r.preco)r.preco='Bom preço';
});
if(!prefs.catsCustom)prefs.catsCustom=[];
if(!prefs.vibesCustom)prefs.vibesCustom=[];

let nextId=Math.max(0,...data.map(r=>r.id||0))+1;
let activeTab='Todos';
let filters={cidade:[],status:[],periodo:[],vibe:[],companhia:[],preco:[],barTipo:[]};
let search='';
let sort=prefs.sort||'priority';
let editId=null,drawerKey=null,manageMode=null;
let inListView=false;

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function savePrefs(){localStorage.setItem(PREF_KEY,JSON.stringify(prefs));}
function getCidades(){return[...new Set(data.map(r=>r.cidade||'São Paulo'))].sort();}
function getAllCats(){return[...CATS_DEFAULT,...prefs.catsCustom.filter(c=>!CATS_DEFAULT.includes(c))];}
function getAllVibes(){return[...VIBES_DEFAULT,...prefs.vibesCustom.filter(v=>!VIBES_DEFAULT.includes(v))];}
function getCatColor(c){return(prefs.catsColors&&prefs.catsColors[c])||CAT_COLOR_MAP[c]||'#6C6C6C';}
function getCatIcon(c){return(prefs.catsIcons&&prefs.catsIcons[c])||CAT_ICON[c]||'🍽';}
function esc(s){return String(s).replace(/'/g,"\\'");}
function filterCount(){return Object.values(filters).reduce((s,a)=>s+a.length,0);}

function exportJSON(){
  const b=new Blob([JSON.stringify({data,prefs},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='restaurantes_backup.json';a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      const d=parsed.data||parsed;
      if(!Array.isArray(d))throw 0;
      data=d;
      if(parsed.prefs)prefs=parsed.prefs;
      if(!prefs.catsColors)prefs.catsColors={};
if(!prefs.catsIcons)prefs.catsIcons={};
      data.forEach(r=>{
        if(!r.cidade)r.cidade='São Paulo';
        if(!Array.isArray(r.periodo))r.periodo=[];
        if(!Array.isArray(r.vibe))r.vibe=[];
        if(!Array.isArray(r.companhia))r.companhia=[];
        if(!Array.isArray(r.status))r.status=['Quero conhecer'];
        if(r.obs===undefined)r.obs='';
        if(r.vibeCustom===undefined)r.vibeCustom='';
        if(r.priority===undefined)r.priority=false;
        if(r.barTipo===undefined)r.barTipo='';
        if(!r.preco)r.preco='Bom preço';
      });
      if(!prefs.catsCustom)prefs.catsCustom=[];
      if(!prefs.vibesCustom)prefs.vibesCustom=[];
      nextId=Math.max(0,...data.map(r=>r.id||0))+1;
      save();savePrefs();goHome();alert('Importado! '+d.length+' lugares.');
    }catch{alert('Arquivo inválido.');}
  };
  r.readAsText(f);e.target.value='';
}

function openMenu(){document.getElementById('menu-overlay').classList.add('show');document.getElementById('menu-drawer').classList.add('show');}
function closeMenu(){document.getElementById('menu-overlay').classList.remove('show');document.getElementById('menu-drawer').classList.remove('show');}
document.getElementById('menu-overlay').onclick=closeMenu;

function buildHome(){
  document.getElementById('home-view').classList.remove('hidden');
  document.getElementById('list-view').classList.add('hidden');
  inListView=false;
  const total=data.length;
  const visited=data.filter(r=>r.status.includes('Já fui')).length;
  document.getElementById('home-sub').textContent=`${total} lugares · ${visited} visitados`;
  const cats=['Todos',...getAllCats()];
  const grid=document.getElementById('cat-grid');
  grid.innerHTML=cats.map(c=>{
    const color=c==='Todos'?'#2C2C2E':getCatColor(c);
    const icon=c==='Todos'?'🗺':getCatIcon(c);
    const cnt=c==='Todos'?data.length:data.filter(r=>r.c===c).length;
    if(cnt===0&&c!=='Todos'&&!prefs.catsCustom.includes(c))return'';
    const isTodos=c==='Todos';
    return`<div class="cat-card${isTodos?' cat-card-todos':''}" style="background:linear-gradient(135deg,${color}dd,${color}88)" onclick="openCat('${esc(c)}')">
      <div>
        <div class="cat-card-name">${c}</div>
        <div class="cat-card-count">${cnt} lugar${cnt!==1?'es':''}</div>
      </div>
      <div class="cat-card-icon">${icon}</div>
    </div>`;
  }).join('');
}

function openCat(cat){
  activeTab=cat;
  Object.keys(filters).forEach(k=>filters[k]=[]);
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  inListView=true;
  buildFilters();render();
}

function goHome(){
  search='';
  document.getElementById('search').value='';
  buildHome();
}

function getFilterGroups(){
  const groups=[
    {key:'status',label:'Status',opts:()=>STATUS_OPTS},
    {key:'periodo',label:'Período',opts:()=>['café/brunch','almoço','jantar','ambos']},
    {key:'vibe',label:'Vibe',opts:()=>getAllVibes()},
    {key:'companhia',label:'Companhia',opts:()=>COMPANHIAS},
    {key:'preco',label:'Preço',opts:()=>PRECOS},
  ];
  if(activeTab==='Bar & Boteco'||activeTab==='Todos'){
    groups.push({key:'barTipo',label:'Tipo de bar',opts:()=>BAR_TIPOS});
  }
  if(getCidades().length>1){
    groups.unshift({key:'cidade',label:'Cidade',opts:()=>getCidades()});
  }
  return groups;
}

function buildFilters(){
  const cnt=filterCount();
  document.getElementById('filters-wrap').innerHTML=
    getFilterGroups().map(g=>{const n=filters[g.key].length;
      return`<button class="f-btn${n?' on':''}" onclick="openDrawer('${g.key}')">
        ${n?'<span class="f-dot"></span>':''}${g.label}${n?` (${n})`:''}
      </button>`;
    }).join('')+(cnt?`<button class="f-clear" onclick="clearAllFilters()">✕ Limpar</button>`:'');
}

function openDrawer(key){
  drawerKey=key;
  const g=getFilterGroups().find(x=>x.key===key);
  document.getElementById('drawer-title').textContent=g?g.label:'';
  buildDrawerBody();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  buildFilters();render();
}
function clearAllFilters(){Object.keys(filters).forEach(k=>filters[k]=[]);buildDrawerBody();buildFilters();render();}
function clearGroupFilter(){if(drawerKey)filters[drawerKey]=[];buildDrawerBody();}
function buildDrawerBody(){
  const g=getFilterGroups().find(x=>x.key===drawerKey);if(!g)return;
  document.getElementById('drawer-body').innerHTML=`<div class="d-chips">${g.opts().map(o=>`<span class="dchip${filters[g.key].includes(o)?' on':''}" onclick="toggleF('${g.key}','${esc(o)}')">${o}</span>`).join('')}</div>`;
}
function toggleF(key,val){const a=filters[key],i=a.indexOf(val);if(i>-1)a.splice(i,1);else a.push(val);buildDrawerBody();}

function openManageCategories(){manageMode='cats';document.getElementById('manage-title').textContent='Gerenciar categorias';buildManageBody();document.getElementById('manage-overlay').classList.add('show');document.getElementById('manage-drawer').classList.add('show');}
function openManageVibes(){manageMode='vibes';document.getElementById('manage-title').textContent='Gerenciar vibes';buildManageBody();document.getElementById('manage-overlay').classList.add('show');document.getElementById('manage-drawer').classList.add('show');}
function closeManage(){document.getElementById('manage-overlay').classList.remove('show');document.getElementById('manage-drawer').classList.remove('show');manageMode=null;}
document.getElementById('manage-overlay').onclick=closeManage;

function buildManageBody(){
  const isC=manageMode==='cats';
  const defaults=isC?CATS_DEFAULT:VIBES_DEFAULT;
  const customs=isC?prefs.catsCustom:prefs.vibesCustom;
  const hidden=isC?(prefs.catsHidden||[]):(prefs.vibesHidden||[]);
  const allVisible=[...defaults.filter(v=>!hidden.includes(v)),...customs];
  const allHidden=defaults.filter(v=>hidden.includes(v));
  document.getElementById('manage-body').innerHTML=`
    <p style="font-size:13px;color:var(--text3);margin-bottom:14px">${isC?'Toque em × para remover uma categoria. Categorias removidas com lugares existentes ficam ocultas mas os dados são preservados.':'Toque em × para remover. As vibes padrão ficam sempre disponíveis.'}</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
      ${allVisible.map(v=>`<span class="mchip-del" onclick="removeCustom('${esc(v)}')">${v} <span>×</span></span>`).join('')}
    </div>
    ${allHidden.length?`<p style="font-size:12px;color:var(--text3);margin-bottom:8px">Ocultas (ainda em uso em alguns lugares):</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
      ${allHidden.map(v=>`<span class="mchip" style="opacity:.4;font-size:12px;padding:6px 12px">${v} <button onclick="restoreCustom('${esc(v)}')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0 0 0 4px">↺</button></span>`).join('')}
    </div>`:''}
    <div class="add-custom-row">
      <input class="add-custom-input" id="manage-input" placeholder="${isC?'Nova categoria...':'Nova vibe...'}" onkeydown="if(event.key==='Enter')addCustom()">
      <button class="add-custom-btn" onclick="addCustom()">+</button>
    </div>`;
}
function addCustom(){
  const input=document.getElementById('manage-input');
  const val=input.value.trim();if(!val)return;
  const isC=manageMode==='cats';
  const arr=isC?prefs.catsCustom:prefs.vibesCustom;
  const defaults=isC?CATS_DEFAULT:VIBES_DEFAULT;
  const hidden=isC?(prefs.catsHidden||[]):(prefs.vibesHidden||[]);
  if(hidden.includes(val)){restoreCustom(val);input.value='';return;}
  if(arr.includes(val)||defaults.includes(val)){input.value='';return;}
  if(!isC){arr.push(val);savePrefs();input.value='';buildManageBody();if(inListView)buildFilters();else buildHome();return;}
  // para categorias: abre seletor de cor e ícone
  openCatCustomizer(val);
}

function openCatCustomizer(nome){
  const CORES=['#E8622A','#C0392B','#8E44AD','#2980B9','#E74C3C','#E67E22','#7D3C98','#1A7F6E','#D4AC0D','#27AE60','#E91E8C','#2C3E50','#16A085','#D35400','#6C3483'];
  const ICONS=['🍕','🍔','🍝','🦞','🍣','🥢','🥩','✨','🍺','☕','🍨','📦','🍽','🥗','🌮','🍜','🫕','🥘','🍱','🥩','🍷','🧁','🍰','🥐','🌯'];
  let selColor=CORES[0];let selIcon=ICONS[0];
  const bd=document.createElement('div');
  bd.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)';
  bd.innerHTML=`<div onclick="event.stopPropagation()" style="background:#1C1C1E;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;padding-bottom:36px">
    <div style="width:36px;height:4px;background:#3A3A3C;border-radius:2px;margin:0 auto 16px"></div>
    <div style="font-size:17px;font-weight:700;margin-bottom:16px">Personalizar "${nome}"</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#48484A;margin-bottom:10px">Cor</div>
    <div id="cust-colors" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
      ${CORES.map((c,i)=>`<div onclick="selCustColor('${c}',this)" data-color="${c}" style="width:36px;height:36px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${i===0?'#fff':'transparent'};transition:border-color .15s"></div>`).join('')}
    </div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#48484A;margin-bottom:10px">Ícone</div>
    <div id="cust-icons" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px">
      ${ICONS.map((ic,i)=>`<div onclick="selCustIcon('${ic}',this)" data-icon="${ic}" style="width:44px;height:44px;border-radius:12px;background:#2C2C2E;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid ${i===0?'#E8622A':'transparent'};transition:border-color .15s">${ic}</div>`).join('')}
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="document.body.removeChild(document.getElementById('cat-customizer'))" style="flex:1;padding:14px;border-radius:13px;font-size:16px;font-weight:600;border:none;background:#2C2C2E;color:#8E8E93;cursor:pointer;font-family:'Inter',sans-serif">Cancelar</button>
      <button onclick="confirmCatCustomizer('${nome.replace(/'/g,"\\'")}',document.getElementById('cat-customizer'))" style="flex:1;padding:14px;border-radius:13px;font-size:16px;font-weight:600;border:none;background:#E8622A;color:#fff;cursor:pointer;font-family:'Inter',sans-serif">Adicionar</button>
    </div>
  </div>`;
  bd.id='cat-customizer';
  bd.onclick=()=>document.body.removeChild(bd);
  document.body.appendChild(bd);
  window._custColor=CORES[0];window._custIcon=ICONS[0];
}
function selCustColor(c,el){
  window._custColor=c;
  document.querySelectorAll('#cust-colors div').forEach(d=>d.style.borderColor='transparent');
  el.style.borderColor='#fff';
}
function selCustIcon(ic,el){
  window._custIcon=ic;
  document.querySelectorAll('#cust-icons div').forEach(d=>d.style.borderColor='transparent');
  el.style.borderColor='#E8622A';
}
function confirmCatCustomizer(nome,bd){
  if(!prefs.catsCustom)prefs.catsCustom=[];
  if(!prefs.catsColors)prefs.catsColors={};
  if(!prefs.catsIcons)prefs.catsIcons={};
  prefs.catsCustom.push(nome);
  prefs.catsColors[nome]=window._custColor;
  prefs.catsIcons[nome]=window._custIcon;
  savePrefs();
  document.body.removeChild(bd);
  const inp=document.getElementById('manage-input');if(inp)inp.value='';
  buildManageBody();
  if(inListView)buildFilters();else buildHome();
}
function removeCustom(val){
  const isC=manageMode==='cats';
  const defaults=isC?CATS_DEFAULT:VIBES_DEFAULT;
  if(isC){
    const inUse=data.some(r=>r.c===val);
    if(defaults.includes(val)){
      // oculta em vez de excluir se estiver em uso
      if(inUse){if(!prefs.catsHidden)prefs.catsHidden=[];if(!prefs.catsHidden.includes(val))prefs.catsHidden.push(val);}
      // se não estiver em uso, só oculta mesmo
      else{if(!prefs.catsHidden)prefs.catsHidden=[];if(!prefs.catsHidden.includes(val))prefs.catsHidden.push(val);}
    } else {
      prefs.catsCustom=prefs.catsCustom.filter(v=>v!==val);
    }
  } else {
    prefs.vibesCustom=prefs.vibesCustom.filter(v=>v!==val);
  }
  savePrefs();buildManageBody();
  if(inListView)buildFilters();else buildHome();
}
function restoreCustom(val){
  const isC=manageMode==='cats';
  if(isC){prefs.catsHidden=(prefs.catsHidden||[]).filter(v=>v!==val);}
  else{prefs.vibesHidden=(prefs.vibesHidden||[]).filter(v=>v!==val);}
  savePrefs();buildManageBody();
  if(inListView)buildFilters();else buildHome();
}

function filtered(){
  return data.filter(r=>{
    if(activeTab!=='Todos'&&r.c!==activeTab)return false;
    if(search&&!r.n.toLowerCase().includes(search.toLowerCase()))return false;
    if(filters.cidade&&filters.cidade.length&&!filters.cidade.includes(r.cidade||'São Paulo'))return false;
    if(filters.status.length&&!filters.status.some(f=>r.status.includes(f)))return false;
    if(filters.periodo.length&&r.periodo&&r.periodo.length&&!filters.periodo.some(f=>r.periodo.includes(f)))return false;
    const allV=[...(r.vibe||[]),r.vibeCustom].filter(Boolean);
    if(filters.vibe.length&&allV.length&&!filters.vibe.some(f=>allV.includes(f)))return false;
    if(filters.companhia.length&&r.companhia&&r.companhia.length&&!filters.companhia.some(f=>r.companhia.includes(f)))return false;
    if(filters.preco.length&&!filters.preco.includes(r.preco))return false;
    if(filters.barTipo&&filters.barTipo.length&&!filters.barTipo.includes(r.barTipo))return false;
    return true;
  });
}

function cycleSort(){
  const modes=['priority','az','za','rating'];
  const labels={priority:'Prioridade',az:'A–Z',za:'Z–A',rating:'Nota'};
  const i=modes.indexOf(sort);
  sort=modes[(i+1)%modes.length];
  prefs.sort=sort;savePrefs();
  document.getElementById('sort-lbl').textContent=labels[sort];
  render();
}

function render(){
  const sortLabels={priority:'Prioridade',az:'A–Z',za:'Z–A',rating:'Nota'};
  document.getElementById('sort-lbl').textContent=sortLabels[sort]||'Prioridade';
  const list=[...filtered()].sort((a,b)=>{
    if(sort==='priority'){if(b.priority!==a.priority)return b.priority?1:-1;return(b.r||0)-(a.r||0);}
    if(sort==='az')return a.n.localeCompare(b.n,'pt');
    if(sort==='za')return b.n.localeCompare(a.n,'pt');
    return(b.r||0)-(a.r||0);
  });
  const cnt=list.length;
  const catLabel=activeTab==='Todos'?'Todos':activeTab;
  document.getElementById('list-count').innerHTML=`<strong>${catLabel}</strong> · ${cnt} lugar${cnt!==1?'es':''}`;
  const el=document.getElementById('cards');
  if(!cnt){el.innerHTML=`<div class="empty">Nenhum lugar encontrado.</div>`;return;}
  el.innerHTML=list.map(r=>{
    const cc=getCatColor(r.c);
    const allVibes=[...(r.vibe||[]),r.vibeCustom].filter(Boolean);
    const statusHtml=r.status.map(s=>`<span class="spill ${STATUS_STYLE[s]||''}">${s}</span>`).join('');
    const scoreHtml=r.r?`<span class="card-score">${r.r}/10</span>`:'';
    const cidTag=r.cidade&&r.cidade!=='São Paulo'?`<span class="ctag ctag-cidade">${r.cidade}</span>`:'';
    const barTag=r.barTipo?`<span class="ctag">${r.barTipo}</span>`:'';
    const isQC=r.status.length===1&&r.status[0]==='Quero conhecer';
const tags=isQC?[]:[...(r.periodo||[]),...allVibes,...(r.companhia||[]),r.preco].filter(Boolean);
    return`<div class="card${r.priority?' priority':''}" onclick="openEdit(${r.id})">
      <div class="card-stripe" style="background:${cc}"></div>
      <div class="card-body">
        <div class="card-row1">
          <div class="card-name">${r.priority?'<span class="priority-icon">★</span>':''} ${r.n}</div>
          <div>${scoreHtml}</div>
        </div>
        <div class="card-status-pills">${statusHtml}</div>
        ${tags.length||barTag||cidTag?`<div class="card-tags">${barTag}${tags.map(t=>`<span class="ctag">${t}</span>`).join('')}${cidTag}</div>`:''}
        ${r.obs?`<div class="card-obs">${r.obs}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function openAdd(){showModal(null);}
function openEdit(id){showModal(data.find(r=>r.id===id));}

function showModal(r){
  const isNew=!r;
  editId=isNew?null:r.id;
  const d=r||{n:'',c:'Outros',barTipo:'',cidade:'São Paulo',status:['Quero conhecer'],r:0,periodo:[],vibe:[],vibeCustom:'',companhia:[],preco:'Bom preço',obs:'',priority:false};
  window._md={...d,status:[...d.status],periodo:[...(d.periodo||[])],vibe:[...(d.vibe||[])],companhia:[...(d.companhia||[])]};
  document.getElementById('modal-title').textContent=isNew?'Novo lugar':'Editar lugar';
  renderModalBody();
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('modal').classList.add('show'),10);
  setTimeout(()=>document.getElementById('m-n')&&document.getElementById('m-n').focus(),350);
}

function renderModalBody(){
  const d=window._md;
  const isQC=d.status.length===1&&d.status[0]==='Quero conhecer';
  const cids=getCidades();
  const vibesAll=getAllVibes();
  const isBar=d.c==='Bar & Boteco';
  document.getElementById('modal-body').innerHTML=`
    <div class="mfield"><label>Nome</label><input id="m-n" value="${(d.n||'').replace(/"/g,'&quot;')}" placeholder="Nome do restaurante" oninput="window._md.n=this.value"></div>
    <div class="mfield"><label>Categoria</label>
      <select id="m-c" onchange="onCatChange(this.value)">${getAllCats().map(c=>`<option${c===d.c?' selected':''}>${c}</option>`).join('')}</select>
    </div>
    ${isBar?`<div class="mfield"><label>Tipo de bar</label><div class="mchips">${BAR_TIPOS.map(o=>`<span class="mchip${d.barTipo===o?' sel':''}" data-f="barTipo" data-v="${o}" onclick="togS(this)">${o}</span>`).join('')}</div></div>`:''}
    <div class="mfield"><label>Cidade</label>
      <input id="m-cidade" value="${d.cidade||'São Paulo'}" placeholder="São Paulo" oninput="updCidSugs(this.value)">
      <div class="cidade-sugs" id="cid-sugs">${cids.map(c=>`<button class="csug" onclick="setCid('${esc(c)}')">${c}</button>`).join('')}</div>
    </div>
    <div class="mfield"><label>Status</label><div class="mchips">${STATUS_OPTS.map(o=>`<span class="mchip${d.status.includes(o)?' sel-m':''}" data-f="status" data-v="${esc(o)}" onclick="onStatusClick(this)">${o}</span>`).join('')}</div></div>
    <div id="extra-fields" ${isQC?'class="hidden"':''}>
      <div class="section-divider"></div>
      <div class="mfield"><label>Período <span>(opcional)</span></label><div class="mchips">${['café/brunch','almoço','jantar','ambos'].map(o=>`<span class="mchip${(d.periodo||[]).includes(o)?' sel-m':''}" data-f="periodo" data-v="${o}" onclick="togM(this)">${o}</span>`).join('')}</div></div>
      <div class="mfield"><label>Vibe <span>(opcional)</span></label>
        <div class="mchips">${vibesAll.map(o=>`<span class="mchip${(d.vibe||[]).includes(o)?' sel-m':''}" data-f="vibe" data-v="${esc(o)}" onclick="togM(this)">${o}</span>`).join('')}</div>
        <input style="margin-top:8px;width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);padding:9px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none" id="m-vibe-custom" value="${d.vibeCustom||''}" placeholder="Vibe personalizada (opcional)">
      </div>
      <div class="mfield"><label>Companhia <span>(opcional)</span></label><div class="mchips">${COMPANHIAS.map(o=>`<span class="mchip${(d.companhia||[]).includes(o)?' sel-m':''}" data-f="companhia" data-v="${o}" onclick="togM(this)">${o}</span>`).join('')}</div></div>
      <div class="mfield"><label>Preço</label><div class="mchips">${PRECOS.map(o=>`<span class="mchip${d.preco===o?' sel':''}" data-f="preco" data-v="${esc(o)}" onclick="togS(this)">${o}</span>`).join('')}</div></div>
      <div class="mfield"><label>Nota (0–10)</label>
        <div class="score-wrap">
          <input type="range" class="score-slider" id="m-score" min="0" max="10" value="${d.r||0}" oninput="document.getElementById('m-score-val').textContent=this.value;window._md.r=parseInt(this.value)">
          <span class="score-val" id="m-score-val">${d.r||0}</span>
        </div>
      </div>
      <div class="mfield"><label>Prioridade</label>
        <div class="priority-toggle${d.priority?' on':''}" id="priority-toggle" onclick="togglePriority()">
          <span class="priority-toggle-label">Destacar este lugar</span>
          <span class="priority-toggle-icon">${d.priority?'★':'☆'}</span>
        </div>
      </div>
      <div class="mfield"><label>Observação</label><textarea id="m-obs" placeholder="ex: pedir a burrata, só com reserva...">${d.obs||''}</textarea></div>
    </div>`;
  const eid=editId;
  document.getElementById('modal-footer').innerHTML=
    (eid!==null?`<button class="m-act m-act-danger" onclick="delPlace(${eid})">Excluir</button>`:'')
    +`<button class="m-act" onclick="closeModal()" style="${eid===null?'margin-left:auto':''}">Cancelar</button>
    <button class="m-act m-act-primary" onclick="saveModal()">Salvar</button>`;
}

function onCatChange(val){window._md.c=val;window._md.barTipo='';renderModalBody();}
function onStatusClick(el){
  const v=el.dataset.v;
  const arr=window._md.status;
  const i=arr.indexOf(v);
  if(i>-1)arr.splice(i,1);else arr.push(v);
  renderModalBody();
}
function togM(el){
  const f=el.dataset.f,v=el.dataset.v;
  if(!Array.isArray(window._md[f]))window._md[f]=[];
  const a=window._md[f],ix=a.indexOf(v);
  if(ix>-1)a.splice(ix,1);else a.push(v);
  el.classList.toggle('sel-m',window._md[f].includes(v));
}
function togS(el){
  const f=el.dataset.f,v=el.dataset.v;
  el.closest('.mchips').querySelectorAll('.mchip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');window._md[f]=v;
}
function setCid(c){const el=document.getElementById('m-cidade');if(el)el.value=c;window._md.cidade=c;}
function updCidSugs(val){
  window._md.cidade=val;
  const f=val?getCidades().filter(c=>c.toLowerCase().includes(val.toLowerCase())):getCidades();
  const el=document.getElementById('cid-sugs');
  if(el)el.innerHTML=f.map(c=>`<button class="csug" onclick="setCid('${esc(c)}')">${c}</button>`).join('');
}
function togglePriority(){
  window._md.priority=!window._md.priority;
  const el=document.getElementById('priority-toggle');
  if(el){el.classList.toggle('on',window._md.priority);el.querySelector('.priority-toggle-icon').textContent=window._md.priority?'★':'☆';}
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modal-overlay').classList.remove('show');
}
function saveModal(){
  const nEl=document.getElementById('m-n');
  const nome=(nEl?nEl.value:'').trim()||window._md.n;
  if(!nome)return;
  const md=window._md;
  const isQC=md.status.length===1&&md.status[0]==='Quero conhecer';
  const obj={
    n:nome,
    c:document.getElementById('m-c')?document.getElementById('m-c').value:md.c,
    barTipo:md.barTipo||'',
    cidade:(document.getElementById('m-cidade')?document.getElementById('m-cidade').value.trim():md.cidade)||'São Paulo',
    status:md.status&&md.status.length?md.status:['Quero conhecer'],
    r:isQC?0:(parseInt(document.getElementById('m-score')?document.getElementById('m-score').value:md.r)||0),
    periodo:isQC?[]:md.periodo||[],
    vibe:isQC?[]:md.vibe||[],
    vibeCustom:isQC?'':(document.getElementById('m-vibe-custom')?document.getElementById('m-vibe-custom').value.trim():md.vibeCustom||''),
    companhia:isQC?[]:md.companhia||[],
    preco:isQC?'':md.preco||'Bom preço',
    obs:document.getElementById('m-obs')?document.getElementById('m-obs').value.trim():md.obs||'',
    priority:isQC?false:(md.priority||false),
  };
  if(editId===null){obj.id=nextId++;data.push(obj);}
  else{const i=data.findIndex(r=>r.id===editId);if(i>-1)data[i]={...data[i],...obj};}
  save();closeModal();
  if(inListView){buildFilters();render();}else buildHome();
}
function delPlace(id){
  if(!confirm('Excluir?'))return;
  data=data.filter(r=>r.id!==id);
  save();closeModal();
  if(inListView){buildFilters();render();}else buildHome();
}

document.getElementById('search').addEventListener('input',e=>{
  search=e.target.value;
  if(search&&!inListView){
    activeTab='Todos';
    document.getElementById('home-view').classList.add('hidden');
    document.getElementById('list-view').classList.remove('hidden');
    inListView=true;
    buildFilters();
  }
  if(!search&&inListView){goHome();return;}
  if(inListView)render();
});

buildHome();
</script>
</body>
</html>
